[project]
name = "mirava"
version = "0.1.0"
description = "mirava.ai — an always-on world of 1,000 AI agents in Indiranagar, Bengaluru"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "numpy>=2.0",
  "duckdb>=1.1",
  "pyyaml>=6.0",
  "pillow>=10.4",
  "google-cloud-firestore>=2.18",
  "google-cloud-storage>=2.18",
  "google-cloud-bigquery>=3.25",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = ["cloud: needs real cloud resources (skipped by default)", "slow: rebuilds the map twice (~45 s)"]
addopts = "-m 'not cloud' -q"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["web", "tools/visual", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
allow_redefinition_new = true
local_partial_types = true
exclude = ["web/", "tools/visual/", "[.]venv/"]
