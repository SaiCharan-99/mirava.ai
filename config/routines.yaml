# Routine templates (P-04, E-01). Each day type is a list of blocks; a block lasts until the next one starts.
# act: sleep|home|work|school|college|eat|cafe|gym|park|shop|store_shift|roam   (roam = gig work hopping between places)
# `options` picks one act per day (weights); `home` means stay home. Times jitter per agent by ±jitter_min.
jitter_min: 25
templates:
  office:
    weekday:
      - {at: "00:00", act: sleep}
      - {at: "06:50", act: home}
      - {at: "08:40", act: work}
      - {at: "13:00", act: eat}
      - {at: "13:50", act: work}
      - {at: "18:30", options: {home: 0.35, gym: 0.18, cafe: 0.2, shop: 0.15, park: 0.12}}
      - {at: "20:00", act: home}
      - {at: "23:15", act: sleep}
    weekend:
