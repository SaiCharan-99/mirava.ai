# Simulated Indian smartphone market (P-06). Real brands appear only as owned possessions, labelled simulated.
# All shares and hazards are labelled assumptions.
assumed: true
price_band_by_income:      # income band → share of price bands
  "<25k":   {budget: 0.80, mid: 0.17, premium: 0.03, flagship: 0.0}
  "25-50k": {budget: 0.50, mid: 0.40, premium: 0.08, flagship: 0.02}
  "50k-1L": {budget: 0.18, mid: 0.50, premium: 0.24, flagship: 0.08}
  "1-2L":   {budget: 0.05, mid: 0.35, premium: 0.35, flagship: 0.25}
  ">2L":    {budget: 0.02, mid: 0.13, premium: 0.35, flagship: 0.50}
brand_share_by_band:
  budget:   {Xiaomi: 0.24, Vivo: 0.20, realme: 0.16, Samsung: 0.16, Oppo: 0.12, Motorola: 0.08, Apple: 0.04}
  mid:      {Samsung: 0.24, Vivo: 0.17, Xiaomi: 0.14, OnePlus: 0.14, Oppo: 0.11, realme: 0.08, Motorola: 0.06, Apple: 0.06}
  premium:  {Samsung: 0.30, OnePlus: 0.22, Apple: 0.22, Vivo: 0.10, Oppo: 0.08, Xiaomi: 0.08}
  flagship: {Apple: 0.55, Samsung: 0.35, OnePlus: 0.06, Google: 0.04}
tier_price_inr:
  budget: [7000, 15000]
  mid: [15000, 30000]
  premium: [30000, 60000]
  flagship: [60000, 160000]
# phone age in years ~ lognormal(mu, sigma) clipped [0.05, 9]; median exp(mu) ≈ 2.5 y, ~17% older than 5 y
age_years: {mu: 0.92, sigma: 0.78, min: 0.05, max: 9.0}
# daily hazards (probability per agent per sim day) at age 0, multiplied by (1 + age_years * age_slope)
hazards:
  lost:   {base: 0.00008, age_slope: 0.0}
  broken: {base: 0.00030, age_slope: 0.30}
  slow:   {base: 0.00030, age_slope: 0.60}
lifestyle_hazard_multiplier: {student_life: 1.5, fitness_focused: 1.3, social_butterfly: 1.2}
# Baseline market (S-06): generic current models of the real brands agents know, by tier (simulated; no real model names).
baseline_market:
  - {id: "baseline:budget", label: "a current budget phone of a familiar brand", tier: budget, price_inr: 11000, appeal: 0.45}
  - {id: "baseline:mid", label: "a current mid-range phone of a familiar brand", tier: mid, price_inr: 22000, appeal: 0.55}
  - {id: "baseline:premium", label: "a current premium phone of a familiar brand", tier: premium, price_inr: 45000, appeal: 0.6}
  - {id: "baseline:flagship", label: "a current flagship of a familiar brand", tier: flagship, price_inr: 95000, appeal: 0.65}

# Opinion engine (phase 1): what a phone is like per attribute (0..1), by tier, nudged by brand character; simulated
# assumptions (no real model names). A person's own phone is their yardstick; wear lowers it.
spec_priors:
  tier:
    budget:   {battery: 0.55, camera: 0.30, display: 0.35, performance: 0.30, software: 0.35, design: 0.30, price_value: 0.85, brand: 0.40}
    mid:      {battery: 0.62, camera: 0.50, display: 0.55, performance: 0.50, software: 0.50, design: 0.50, price_value: 0.65, brand: 0.50}
    premium:  {battery: 0.68, camera: 0.68, display: 0.72, performance: 0.70, software: 0.65, design: 0.70, price_value: 0.40, brand: 0.65}
    flagship: {battery: 0.72, camera: 0.88, display: 0.90, performance: 0.92, software: 0.85, design: 0.90, price_value: 0.18, brand: 0.85}
  brand_adjust:
    Apple:    {software: 0.15, design: 0.08, brand: 0.15, battery: -0.10, price_value: -0.12}
    Samsung:  {display: 0.08, camera: 0.04, brand: 0.08, software: 0.02}
    Google:   {software: 0.12, camera: 0.08, battery: -0.04}
    OnePlus:  {performance: 0.06, battery: 0.04}
    Xiaomi:   {price_value: 0.10, battery: 0.06, software: -0.08}
    Vivo:     {camera: 0.05, design: 0.04}
    Oppo:     {camera: 0.04, design: 0.05}
    realme:   {price_value: 0.08, performance: 0.04, software: -0.06}
    Motorola: {software: 0.06, price_value: 0.05, camera: -0.04}
condition_penalty:        # worn / damaged phones are worse than their tier suggests
  cracked: {design: 0.20, display: 0.20}
  slow: {performance: 0.30}
  battery_weak: {battery: 0.35}
  lost: {battery: 0.20, camera: 0.20, display: 0.20, performance: 0.20, software: 0.20, design: 0.20}
