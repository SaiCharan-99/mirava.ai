# Population priors for Indiranagar, Bengaluru (P-01). Simulated data.
# Sources: India age structure from the US Census Bureau International Database
# (bigquery-public-data.census_bureau_international, values cached here) and urban labour shares from World Bank WDI
# (bigquery-public-data.world_bank_wdi, cached). The Indiranagar skew (young professionals, higher incomes) is a
# labelled assumption.
sources:
  age_bands: {source: "Census IDB India 2025 urban, reweighted for Indiranagar", assumed: true}
  gender: {source: "Census IDB India 2025", assumed: false}
  occupation: {source: "World Bank WDI urban employment shares + local assumptions", assumed: true}
  income_band: {source: "assumption (Indiranagar affluent)", assumed: true}
  commute_mode: {source: "assumption (Bengaluru mode share)", assumed: true}
  household_mix: {source: "assumption", assumed: true}

age_bands:            # inclusive [lo, hi] → share
  - {lo: 5,  hi: 9,  share: 0.06}
  - {lo: 10, hi: 17, share: 0.08}
  - {lo: 18, hi: 24, share: 0.14}
  - {lo: 25, hi: 34, share: 0.27}
  - {lo: 35, hi: 44, share: 0.18}
  - {lo: 45, hi: 59, share: 0.16}
  - {lo: 60, hi: 74, share: 0.09}
  - {lo: 75, hi: 88, share: 0.02}

gender: {female: 0.49, male: 0.51}

