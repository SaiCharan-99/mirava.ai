            shopkeeper: 0.07, auto_driver: 0.04, delivery_partner: 0.03, homemaker: 0.15, govt_employee: 0.05,
            startup_founder: 0.03, lawyer: 0.03, accountant: 0.04, security_guard: 0.03, domestic_worker: 0.04,
