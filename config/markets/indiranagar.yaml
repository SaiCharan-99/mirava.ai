            startup_founder: 0.03, consultant: 0.04, banker: 0.03, teacher: 0.03, doctor: 0.02, nurse: 0.02,
            shop_assistant: 0.04, salesperson: 0.03, delivery_partner: 0.05, auto_driver: 0.02, restaurant_staff: 0.03,
            content_creator: 0.03, journalist: 0.01, homemaker: 0.05, job_seeker: 0.03, lawyer: 0.02, accountant: 0.03,
            domestic_worker: 0.02}
