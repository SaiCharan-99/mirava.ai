# Media diet distributions (P-04). Simulated; all values are labelled assumptions.
assumed: true
apps: [Instagram, YouTube, community, news_app]
# sessions per day by age band (min, max)
sessions_per_day: {"5-17": [1, 3], "18-34": [3, 6], "35-59": [2, 4], "60-88": [1, 2]}
session_minutes: [5, 35]
# preferred session start windows (minute of day)
windows: [[420, 510], [760, 820], [1080, 1170], [1260, 1380]]
app_weights_by_age:
