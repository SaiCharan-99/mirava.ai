  "18-34": {Instagram: 0.5, YouTube: 0.3, community: 0.2}
  "35-59": {YouTube: 0.45, Instagram: 0.3, community: 0.1, news_app: 0.15}
  "60-88": {YouTube: 0.5, news_app: 0.5}
community_prob: {"5-17": 0.0, "18-34": 0.55, "35-59": 0.3, "60-88": 0.05}
newspaper_prob: {"5-17": 0.05, "18-34": 0.15, "35-59": 0.45, "60-88": 0.8}
newspaper_minute: [400, 480]
news_app_prob: {"5-17": 0.0, "18-34": 0.3, "35-59": 0.45, "60-88": 0.3}
forums: [r/IndiranagarLife, r/BangaloreTech, r/BangaloreStyle]
